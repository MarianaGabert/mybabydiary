<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | My Baby Diary</title>
  <link rel="stylesheet" href="CSS/style.css">
  </head>
<body>
<form class="login-card" id="formLogin">
  <main class="login-page">
    <section class="phone-container">
      <div class="top-decoration">
        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>
        <div class="heart heart-one"></div>
        <div class="heart heart-two"></div>
      </div>

      <div class="brand">
      <img class="site-logo" src="img/logo-removebg-preview.png" alt=" My Baby Diary">


        <h1>My Baby<br>Diary</h1>
        <p>Cuidando de você e do seu bebê em cada fase.</p>
      </div>

      <form class="login-card">
        <h2>Entrar</h2>

        <label class="input-group">
          <span class="icon">
            <svg viewBox="0 0 24 24">
              <path d="M4 6h16v12H4z"></path>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
          </span>
  <input type="email" name="email" placeholder="E-mail" required>

        </label>

        <label class="input-group">
          <span class="icon">
            <svg viewBox="0 0 24 24">
              <rect x="5" y="10" width="14" height="10" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>
          </span>
         
<input type="password" name="senha" placeholder="Senha" required>
          <button class="eye-button" type="button" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24">
              <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </label>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox">
            <span>Lembrar-me</span>
          </label>

          <a href="#">Esqueci minha senha</a>
        </div>

        <button class="primary-button" type="submit">Entrar</button>

        <div class="divider">
          <span></span>
          <p>ou entre com</p>
          <span></span>
        </div>

        <button class="social-button" type="button">
          <strong class="google">G</strong>
          Continuar com Google
        </button>

        <button class="social-button" type="button">
          <strong class="facebook">f</strong>
          Continuar com Facebook
        </button>

        <p class="signup-text">
          Ainda nao tem uma conta?
        <a href="Cadrasto.html">Cadastre-se</a>
        </p>
      </form>
    </section>
  </main>

  <script src="JS/login.js"></script>
</body>
</html>
